[package]
name = "krystal_concurrent_rust_core"
version = "0.1.0"
edition = "2021"
authors = ["Dušan Kopecký <dusan.kopecky0101@gmail.com>"]
description = "Krystal Stack ultra-low-footprint concurrent Rust FFI co-worker & zero-copy 128B/MMIO kernel"

[lib]
name = "krystal_concurrent_rust_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Zero external dependencies: minimal binary size, zero Tokio thread/heap bloat, ~1.5s compile time.

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[workspace]

