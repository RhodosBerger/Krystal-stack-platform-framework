[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "krystal-stack"
version = "0.1.0"
description = "Krystal-Stack Platform Framework - Heterogeneous Compute & Cyber-Physical Suite"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "pydantic>=2.0.0",
    "numpy>=1.24.0",
    "requests>=2.31.0",
    "psutil>=5.9.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "krystal_*"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",   # line too long
    "E722",   # do not use bare 'except'
    "BLE001", # blind exception catch
    "PLW1510",# subprocess.run without check=
    "RUF012", # mutable class attribute
    "S110",   # try-except-pass
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "-v --tb=short"
