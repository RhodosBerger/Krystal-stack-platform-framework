# ==============================================================================
# KRYSTAL-STACK: PRODUCTION NGINX SUBDOMAIN SSL/TLS & BBQ SECURITY REVERSE PROXY
# ==============================================================================
# Architecture:
#   Public Domain: krystal.yourdomain.sk (Subdomain)
#   Upstream 1 (WordPress CMS & Auth): http://krystal_wordpress:80 (or localhost:80)
#   Upstream 2 (Krystal High-Performance Engine): http://127.0.0.1:8089
# ==============================================================================

# Rate Limiting Zones (Wordfence-style Brute Force Defense)
limit_req_zone $binary_remote_addr zone=wp_subdomain_login:10m rate=3r/m;
limit_req_zone $binary_remote_addr zone=krystal_subdomain_api:10m rate=40r/s;
limit_conn_zone $binary_remote_addr zone=subdomain_conn_limit:10m;

# Upstream definitions
upstream wordpress_subdomain_backend {
    server 127.0.0.1:80;
    keepalive 32;
}

upstream krystal_engine_backend {
    server 127.0.0.1:8089;
    keepalive 64;
}

# 1. HTTP Plaintext Redirect -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name krystal.yourdomain.sk *.krystal.yourdomain.sk;

    # Let's Encrypt ACME Challenge
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Main HTTPS Subdomain Gateway
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name krystal.yourdomain.sk *.krystal.yourdomain.sk;

    # SSL / TLS Modern Cryptography
    ssl_certificate /etc/nginx/certs/subdomain_cert.pem;
    ssl_certificate_key /etc/nginx/certs/subdomain_key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:KrystalSubdomainSSL:50m;
    ssl_session_tickets off;

    # Security & CSP Headers (Permits parent domain & subdomain iframe embedding)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https:; frame-ancestors 'self' https://*.yourdomain.sk https://yourdomain.sk;" always;

    client_max_body_size 64M;
    limit_conn subdomain_conn_limit 20;

    # ── BBQ FIREWALL: BLOCK BAD QUERIES (SQLi, Directory Traversal, RCE, XSS) ──
    # Inspects query string, request URI and dangerous patterns before hitting backends
    if ($query_string ~* "([a-z0-9_.]*|%2e%2e|/)(boot\.ini|etc/passwd|winnt|windows/system32|eval\(|base64_decode\(|passthru\(|system\(|shell_exec\()") {
        return 403;
    }
    if ($query_string ~* "(union.*select|benchmark\(|sleep\(|into.*outfile|load_file\(|waitfor.*delay)") {
        return 403;
    }
    if ($query_string ~* "(<|%3C).*script.*(>|%3E)") {
        return 403;
    }
    if ($request_uri ~* "(/\.env|/\.git|wp-config\.php|/xmlrpc\.php)") {
        return 403;
    }

    # Block access to hidden system files
    location ~* /\.(?!well-known\/) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ── WORDFENCE BRUTE FORCE PROTECTION ON WORDPRESS LOGIN ──
    location = /wp-login.php {
        limit_req zone=wp_subdomain_login burst=5 nodelay;
        proxy_pass http://wordpress_subdomain_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # ── SECURE REVERSE PROXY TO KRYSTAL ENGINE CORE (PORT 8089) ──
    # Mounted at /krystal-core/ so client apps on the subdomain talk through port 443
    location /krystal-core/ {
        limit_req zone=krystal_subdomain_api burst=20 nodelay;
        
        rewrite ^/krystal-core/(.*)$ /$1 break;
        proxy_pass http://krystal_engine_backend;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-WP-Subdomain $host;
        
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    # Also route /api/ directly to Krystal Engine if desired
    location /api/ {
        limit_req zone=krystal_subdomain_api burst=30 nodelay;
        proxy_pass http://krystal_engine_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-WP-Subdomain $host;
    }

    # ── DEFAULT WORDPRESS CMS ROUTING ──
    location / {
        proxy_pass http://wordpress_subdomain_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
