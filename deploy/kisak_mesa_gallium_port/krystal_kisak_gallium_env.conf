# Krystal Sovereign Rust Driver Port v2.0 — Kisak-Mesa Gallium3D + OpenVINO Runtime Unified Profile
# Constitutional Invariants: VITAL_MAX_HP=6, UMA_CEILING=0.78, SourceCodeDelta(Mesa)=0, SourceCodeDelta(OpenVINO)=0

# 1. Kisak-Mesa Gallium3D (Iris / ANV / Zink / LLVMpipe)
MESA_GLTHREAD=true
ANV_GPL=true
ANV_VIDEO_DECODE=1
ZINK_DESCRIPTORS=lazy
MESA_SHADER_CACHE_MAX_SIZE=4G

# 2. Gallium Rusticl OpenCL 3.0 ICD -> OpenVINO GPU Plugin & Stream-CUDA Bridge
RUSTICL_ENABLE=iris,llvmpipe
RUSTICL_FEATURES=fp16,int64
OCL_ICD_VENDORS=/etc/OpenCL/vendors

# 3. OpenVINO Zero-Copy UMA & Blob Cache Binding
OV_CACHE_DIR=/var/cache/krystal-openvino-gallium
OV_GPU_HOST_TASK_PRIORITY=HIGH
OV_ENABLE_MMAP=1

# 4. Krystal #![no_std] Rust Firmware & Vulkan Engine Auto-Preset Layer
ENABLE_KRYSTAL_SOVEREIGN_GALLIUM=1
KRYSTAL_VITAL_MAX_HP=6
KRYSTAL_UMA_CEILING_MILLI=780
KRYSTAL_ENGINE_PRESET_MODE=auto_detect_vk_application_info
