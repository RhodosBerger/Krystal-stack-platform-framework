# ==============================================================================
# KRYSTAL-STACK: NGINX SSL/TLS REVERSE PROXY & BBQ FIREWALL CONFIGURATION
# ==============================================================================
# Implements:
#   1. SSL/TLS termination with TLSv1.2/1.3, HSTS & Perfect Forward Secrecy.
#   2. BBQ Firewall (Block Bad Queries) URL & query string pattern matching.
#   3. Wordfence Brute Force Rate Limiting on /wp-login.php & /xmlrpc.php.
#   4. Antispam Bee request routing & honeypot headers.
# ==============================================================================

# Wordfence Brute Force Rate Limiting Zone
limit_req_zone $binary_remote_addr zone=wp_login_bruteforce:10m rate=3r/m;
limit_req_zone $binary_remote_addr zone=krystal_api_limit:10m rate=30r/s;

server {
    listen 80;
    server_name _;
    # Redirect all plain HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name _;

    # SSL / TLS Modern Cryptographic Configuration
    ssl_certificate /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 64M;

    # ── BBQ FIREWALL: BLOCK BAD QUERIES (SQLi, Traversal, Remote Code Execution) ──
    if ($query_string ~* "([a-z0-9_.]*|%2e%2e|/)(boot\.ini|etc/passwd|winnt|eval\(|base64_decode\(|passthru\(|system\()") {
        return 403;
    }
    if ($query_string ~* "(union.*select|benchmark\(|sleep\(|into.*outfile|load_file\()") {
        return 403;
    }
    if ($query_string ~* "(<|%3C).*script.*(>|%3E)") {
        return 403;
    }

    # Block access to hidden files, backups and source code
    location ~* /\.(?!well-known\/) {
        deny all;
        access_log off;
        log_not_found off;
    }
    location = /wp-config.php {
        deny all;
    }
    location = /xmlrpc.php {
        deny all;
    }

    # ── WORDFENCE BRUTE FORCE PROTECTION ON LOGIN ──
    location = /wp-login.php {
        limit_req zone=wp_login_bruteforce burst=5 nodelay;
        proxy_pass http://krystal_wordpress:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # ── MAIN WORDPRESS PASS ──
    location / {
        proxy_pass http://krystal_wordpress:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
