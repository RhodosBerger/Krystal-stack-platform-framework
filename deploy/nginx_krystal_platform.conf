# Krystal platform server — nginx location block (production model).
# STATUS: written, NOT validated with `nginx -t` (nginx not installed on the authoring host).
# Include inside the existing HTTPS server{} of deploy/nginx_krystal_subdomain_ssl.conf.
#
# Note: that file's krystal_engine_backend points to 127.0.0.1:8089; this server listens on 8090.

limit_req_zone $binary_remote_addr zone=krystal_platform_heavy:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=krystal_platform_light:10m rate=20r/s;

upstream krystal_platform_backend {
    server 127.0.0.1:8090;
    keepalive 16;
}

# Liveness probe — cheap, no rate limit.
location = /healthz {
    proxy_pass http://krystal_platform_backend;
}

# Heavy endpoint: spawns a subprocess + Z3 + psutil per request -> strict rate limit.
location ^~ /api/v1/runtime/trigonometric_hybrid_platform {
    limit_req zone=krystal_platform_heavy burst=4 nodelay;
    proxy_pass http://krystal_platform_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 15s;
}

# Pages (grid, 3D simulation grid, dashboard) and the vendored Babylon.js bundle.
location ~ ^/(adaptive_sync_grid|simulation_grid_3d|trigonometric_hybrid_platform|vendor/babylon\.js)$ {
    limit_req zone=krystal_platform_light burst=40 nodelay;
    proxy_pass http://krystal_platform_backend;
    proxy_set_header Host $host;
}
