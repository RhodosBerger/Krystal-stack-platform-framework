<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Krystal Accounting Studio // ERP Agenda</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;800&family=Outfit:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #07080a;
            --panel-bg: rgba(22, 27, 34, 0.6);
            --border-glow: rgba(102, 252, 241, 0.4);
            --accent-cyan: #66fcf1;
            --accent-dark: #45a29e;
            --text-main: #c5c6c7;
            --text-bright: #ffffff;
            --gold: #ffd700;
            --alert-red: #ff4081;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow-x: hidden;
            display: flex;
            height: 100vh;
        }

        /* Glassmorphism Background Elements */
        .ambient-mesh {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: 
                radial-gradient(circle at 15% 50%, rgba(69, 162, 158, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(102, 252, 241, 0.05) 0%, transparent 50%);
            z-index: -2;
        }

        /* Sidebar Sidebar */
        aside {
            width: 280px;
            background: rgba(11, 12, 16, 0.8);
            border-right: 1px solid var(--border-glow);
            backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            padding: 2rem 0;
            box-shadow: 5px 0 25px rgba(0,0,0,0.5);
            z-index: 10;
        }

        .brand {
            padding: 0 2rem;
            margin-bottom: 3rem;
        }

        .brand h1 {
            font-family: 'Outfit', sans-serif;
            color: var(--accent-cyan);
            font-size: 1.8rem;
            margin: 0;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .brand p {
            margin: 0;
            font-size: 0.8rem;
            color: var(--accent-dark);
            letter-spacing: 2px;
        }

        .nav-item {
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            color: var(--text-main);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            cursor: pointer;
            border-left: 3px solid transparent;
        }

        .nav-item:hover, .nav-item.active {
            background: linear-gradient(90deg, rgba(102,252,241,0.1) 0%, transparent 100%);
            color: var(--text-bright);
            border-left: 3px solid var(--accent-cyan);
        }

        .nav-item svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        /* Main Content Area */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 2rem 3rem;
            overflow-y: auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        header h2 {
            font-family: 'Outfit', sans-serif;
            color: var(--text-bright);
            font-size: 2.2rem;
            margin: 0;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 1rem;
            background: var(--panel-bg);
            padding: 0.5rem 1.5rem;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .user-profile span {
            color: var(--gold);
            font-weight: 600;
            font-size: 0.9rem;
        }

        /* Tools & Grid */
        .tools-bar {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .btn {
            background: transparent;
            border: 1px solid var(--accent-cyan);
            color: var(--accent-cyan);
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn:hover {
            background: var(--accent-cyan);
            color: var(--bg-dark);
            box-shadow: 0 0 15px var(--accent-cyan);
            transform: translateY(-2px);
        }

        .btn.primary {
            background: var(--accent-cyan);
            color: var(--bg-dark);
        }
        .btn.primary:hover {
            background: transparent;
            color: var(--accent-cyan);
        }

        /* Data Registry (Evidencia) Grid */
        .registry-panel {
            background: var(--panel-bg);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 1.2rem;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        th {
            font-family: 'Outfit', sans-serif;
            color: var(--text-bright);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
            background: rgba(0,0,0,0.3);
        }

        td {
            font-size: 0.95rem;
        }

        tr:hover td {
            background: rgba(102, 252, 241, 0.05);
        }

        .status-badge {
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .status-paid { background: rgba(102, 252, 241, 0.1); color: var(--accent-cyan); border: 1px solid var(--accent-cyan); }
        .status-pending { background: rgba(255, 180, 0, 0.1); color: #ffb400; border: 1px solid #ffb400; }

    </style>
</head>
<body>
    <div class="ambient-mesh"></div>

    <aside>
        <div class="brand">
            <h1>KRYSTAL<span>STUDIO</span></h1>
            <p>ERP & AGENDA</p>
        </div>
        <a class="nav-item active">
            <svg viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
            Dashboard
        </a>
        <a class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
            Evidencia Faktúr
        </a>
        <a class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
            Hlavná Kniha (Ledger)
        </a>
        <a class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 9h-2V7h-2v5H6v2h2v5h2v-5h2v-2z"/></svg>
            WooCommerce Sync
        </a>
    </aside>

    <main>
        <header>
            <h2>Kompletná Evidencia (Registry)</h2>
            <div class="user-profile">
                <span>Rola: ADMIN</span>
                <div>jozo_uctovnik</div>
            </div>
        </header>

        <div class="tools-bar">
            <button class="btn primary" onclick="triggerOCRScan()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                OCR Sken Faktúry
            </button>
            <button class="btn" onclick="syncWooCommerce()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.92-10.22l-4.25-4.25"></path></svg>
                Sync WooCommerce
            </button>
            <button class="btn" onclick="exportToOxygen()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path></svg>
                Exportovať do Oxygen Builder
            </button>
        </div>

        <div class="registry-panel">
            <table>
                <thead>
                    <tr>
                        <th>ID Záznamu</th>
                        <th>Dodávateľ / Klient</th>
                        <th>Suma (EUR)</th>
                        <th>Dátum Zápisu</th>
                        <th>Stav</th>
                        <th>Akcie</th>
                    </tr>
                </thead>
                <tbody id="invoice-table-body">
                    <!-- Data will be populated via JS -->
                </tbody>
            </table>
        </div>
    </main>

    <script src="studio.js"></script>
</body>
</html>
