<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KRYSTAL-STACK // 3D PROCEDURAL ARENA</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            overflow: hidden; /* Hide scrollbars for full screen WebGL */
            background-color: #000;
            color: #fff;
            font-family: 'Inter', sans-serif;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Let clicks pass through to 3D canvas if needed */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
            z-index: 10;
        }
        .header {
            text-align: center;
        }
        h1 {
            font-family: 'Cinzel', serif;
            color: #66fcf1;
            margin: 0;
            text-shadow: 0 0 10px rgba(102, 252, 241, 0.5);
        }
        .subtitle {
            font-family: monospace;
            color: #8b92a5;
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            pointer-events: auto; /* Re-enable clicks for buttons */
            margin-bottom: 20px;
        }
        .action-btn {
            background: rgba(11, 12, 16, 0.8);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 15px 30px;
            border-radius: 8px;
            font-weight: bold;
            font-family: monospace;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }
        .action-btn:hover {
            background: rgba(102, 252, 241, 0.2);
            border-color: #66fcf1;
            color: #66fcf1;
            box-shadow: 0 0 20px rgba(102, 252, 241, 0.4);
        }
        .hud {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border: 1px solid #4CAF50;
            color: #4CAF50;
            font-family: monospace;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div class="header">
            <h1>PROCEDURAL 3D ARENA</h1>
            <div class="subtitle">Real-time WebGL Engine (Krystal-Stack)</div>
        </div>
        
        <div class="hud" id="hud">SYSTEM: ONLINE | STATUS: IDLE</div>

        <div class="controls">
            <button class="action-btn" onclick="triggerIdle()">[I] Reset / Idle</button>
            <button class="action-btn" onclick="triggerSpell()" style="border-color: #ff4081; color: #ff4081;">[E] Cast Spell</button>
        </div>
    </div>

    <!-- Load Three.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // --- 1. SETUP SCENE, CAMERA, RENDERER ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.02);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 15);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // --- 2. LIGHTING ---
        const ambientLight = new THREE.AmbientLight(0x222222);
        scene.add(ambientLight);

        const pointLight = new THREE.PointLight(0x66fcf1, 2, 50);
        pointLight.position.set(0, 5, 0);
        scene.add(pointLight);

        // --- 3. PROCEDURAL ENVIRONMENT (Grid / Floor) ---
        const gridHelper = new THREE.GridHelper(50, 50, 0x111111, 0x222222);
        scene.add(gridHelper);

        // --- 4. PROCEDURAL HERO (Crystal Golem/Mage Representation) ---
        const heroGroup = new THREE.Group();
        
        const crystalMaterial = new THREE.MeshStandardMaterial({
            color: 0x0044ff,
            emissive: 0x00ffff,
            emissiveIntensity: 0.5,
            wireframe: false,
            roughness: 0.1,
            metalness: 0.8
        });

        // Body
        const bodyGeo = new THREE.IcosahedronGeometry(1.5, 0);
        const body = new THREE.Mesh(bodyGeo, crystalMaterial);
        body.position.y = 2;
        heroGroup.add(body);

        // Floating shards
        const shards = [];
        for(let i=0; i<5; i++) {
            const shardGeo = new THREE.TetrahedronGeometry(0.5);
            const shard = new THREE.Mesh(shardGeo, crystalMaterial);
            shard.position.set(
                (Math.random() - 0.5) * 4,
                Math.random() * 4 + 1,
                (Math.random() - 0.5) * 4
            );
            shards.push({ mesh: shard, speed: Math.random() * 0.05 + 0.01 });
            heroGroup.add(shard);
        }

        heroGroup.position.set(-5, 0, 0);
        scene.add(heroGroup);

        // --- 5. ENEMY TARGET (Toxic Cube) ---
        const enemyMaterial = new THREE.MeshStandardMaterial({
            color: 0x8a2be2,
            emissive: 0x8a2be2,
            emissiveIntensity: 0.3,
            wireframe: true
        });
        const enemyGeo = new THREE.BoxGeometry(2, 4, 2);
        const enemy = new THREE.Mesh(enemyGeo, enemyMaterial);
        enemy.position.set(5, 2, 0);
        scene.add(enemy);

        // --- 6. ANIMATION STATE VARIABLES ---
        let clock = new THREE.Clock();
        let spellActive = false;
        let spellBeam = null;
        let explosionParticles = null;
        
        const hud = document.getElementById('hud');

        // --- 7. ACTIONS ---
        function triggerIdle() {
            spellActive = false;
            hud.innerText = "SYSTEM: ONLINE | STATUS: IDLE";
            if(spellBeam) { scene.remove(spellBeam); spellBeam = null; }
            if(explosionParticles) { scene.remove(explosionParticles); explosionParticles = null; }
            heroGroup.rotation.y = 0;
        }

        window.triggerIdle = triggerIdle;

        function triggerSpell() {
            if(spellActive) return;
            spellActive = true;
            hud.innerText = "SYSTEM: ONLINE | STATUS: CASTING SPELL";

            // 1. Gather energy (spin hero faster)
            // 2. Create beam
            const beamGeo = new THREE.CylinderGeometry(0.2, 0.2, 10, 8);
            beamGeo.rotateZ(Math.PI / 2);
            const beamMat = new THREE.MeshBasicMaterial({ color: 0x66fcf1, transparent: true, opacity: 0.8 });
            spellBeam = new THREE.Mesh(beamGeo, beamMat);
            spellBeam.position.set(0, 2, 0);
            scene.add(spellBeam);

            // 3. Explosion at target
            const particleGeo = new THREE.BufferGeometry();
            const particleCount = 200;
            const posArray = new Float32Array(particleCount * 3);
            for(let i=0; i<particleCount*3; i++) {
                posArray[i] = (Math.random() - 0.5) * 2; // initial cluster
            }
            particleGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            const particleMat = new THREE.PointsMaterial({ size: 0.1, color: 0x66fcf1 });
            explosionParticles = new THREE.Points(particleGeo, particleMat);
            explosionParticles.position.set(5, 2, 0);
            scene.add(explosionParticles);
            
            // Camera shake effect handled in render loop
        }
        
        window.triggerSpell = triggerSpell;

        // --- 8. RENDER LOOP ---
        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            // Idle animations
            body.rotation.y += 0.01;
            body.position.y = 2 + Math.sin(time * 2) * 0.2;

            shards.forEach((shardData, i) => {
                shardData.mesh.rotation.x += shardData.speed;
                shardData.mesh.rotation.y += shardData.speed;
                shardData.mesh.position.y += Math.sin(time * 3 + i) * 0.01;
            });

            enemy.rotation.y -= 0.005;

            // Spell animation logic
            if (spellActive) {
                heroGroup.rotation.y += 0.1; // Fast spin
                
                if (spellBeam) {
                    spellBeam.scale.y = 1 + Math.sin(time * 20) * 0.2; // pulse beam
                }

                if (explosionParticles) {
                    const positions = explosionParticles.geometry.attributes.position.array;
                    for(let i=0; i<positions.length; i+=3) {
                        // Expand outwards
                        positions[i] *= 1.05; 
                        positions[i+1] *= 1.05;
                        positions[i+2] *= 1.05;
                    }
                    explosionParticles.geometry.attributes.position.needsUpdate = true;
                    explosionParticles.material.opacity -= 0.02;
                    if(explosionParticles.material.opacity <= 0) {
                        scene.remove(explosionParticles);
                        explosionParticles = null;
                        hud.innerText = "SYSTEM: ONLINE | STATUS: TARGET DESTROYED";
                    }
                }
                
                // Slight camera shake
                camera.position.x = (Math.random() - 0.5) * 0.1;
                camera.position.y = 5 + (Math.random() - 0.5) * 0.1;
            } else {
                camera.position.x = 0;
                camera.position.y = 5;
            }

            renderer.render(scene, camera);
        }

        animate();

        // Handle window resize
        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
        });
    </script>
</body>
</html>
