[package]
name = "krystal-core"
version = "0.1.0"
edition = "2021"
authors = ["Dušan Kopecký <user@example.com>"]
description = "High-performance real-time control engine for hardware optimization via OpenVINO"
license = "MIT"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
pyo3 = { version = "0.20", features = ["extension-module"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
dashmap = "5.5"
parking_lot = "0.12"
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
num-traits = "0.2"
statrs = "0.16"
ndarray = { version = "0.15", features = ["serde"] }

# OpenVINO integration (when available)
# openvino = "0.4"

[dev-dependencies]
criterion = "0.5"
proptest = "1.4"

[lib]
name = "krystal_core"
crate-type = ["cdylib"]

[[example]]
name = "basic_governor"
path = "examples/basic_governor.rs"
