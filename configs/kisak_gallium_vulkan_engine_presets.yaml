schema_version: "1.0.0"
constitutional_invariants:
  vital_max_hp: 6
  uma_saturation_ceiling: 0.78
  zero_touch_interposition_p1: true
  rust_driver_core_binary: "native/krystal_sovereign_firmware_rs.dll"
  rust_driver_size_kb: 16.5

kisak_mesa_gallium_knowledge_base:
  upstream_baseline: "ppa:kisak/kisak-mesa (Mesa 25.x Gallium3D + NIR + ANV + Iris + Zink + Rusticl)"
  gallium_architectural_pillars:
    - id: "GAL_01_PIPE_SCREEN_CSO"
      kisak_component: "Gallium pipe_screen / Constant State Objects (cso_cache)"
      kisak_mechanism: "Immutable rasterizer, blend, depth-stencil, and sampler states hashed once instead of per-draw validation."
      krystal_rust_enhancement: "Zero-heap 128B cache-line-aligned FNV-1a CSO table in #![no_std] Rust (0 B malloc overhead, O(1) L1d lookup)."
    - id: "GAL_02_U_THREADED_CONTEXT"
      kisak_component: "u_threaded_context (MESA_GLTHREAD=true)"
      kisak_mechanism: "Asynchronous command batching decoupling application render thread from kernel DRM ioctl submission."
      krystal_rust_enhancement: "128 KB frugal worker stacks (16x smaller than standard 2 MB threads) + zero-spin OS futex parking (0.0% idle CPU)."
    - id: "GAL_03_IRIS_ANV_XE"
      kisak_component: "Intel Iris (Gallium) & ANV (Vulkan 1.4) for Gen11/Gen12 Xe (96 EUs / 768 SPs)"
      kisak_mechanism: "bo_cache bucket allocator, ISL tiling, BLORP blit engine, VK_EXT_graphics_pipeline_library (GPL), BDA."
      krystal_rust_enhancement: "TH_09 Contactless Solder UMA < 0.78 circuit breaker + Chronometric Shadow Multiplexing preventing p99 UMA stutter."
    - id: "GAL_04_ZINK_MULTI_API"
      kisak_component: "Mesa Zink (OpenGL 4.6 over Vulkan 1.4)"
      kisak_mechanism: "Translates Gallium pipe_context draws to VK_KHR_dynamic_rendering and push descriptors."
      krystal_rust_enhancement: "128B Apple-Metal-equivalent PushConstant + BDA fast path with automatic glmark2 non-regression rollback."
    - id: "GAL_05_RUSTICL_STREAM_COMPUTE"
      kisak_component: "Mesa Rusticl (OpenCL 3.0 in Rust over Gallium NIR/SPIR-V)"
      kisak_mechanism: "Compiles OpenCL C / SPIR-V kernels through NIR algebraic/vectorize passes onto Gallium compute queues."
      krystal_rust_enhancement: "Direct Krystal Stream-CUDA Extension (ksStream*, subgroup SIMD8/16/32, 64KB SLM) + Retroactive Validator Generator/Aggregator."
    - id: "GAL_06_NIR_ALGEBRAIC_LOWERING"
      kisak_component: "NIR SSA Intermediate Representation (nir_opt_algebraic, nir_lower_subgroups)"
      kisak_mechanism: "Vectorizes ALU ops and lowers subgroup ballot/shuffle intrinsics to Intel EU GRF registers."
      krystal_rust_enhancement: "TH_01 IEEE-754 FTZ/DAZ pre-sanitization flushing denormal uniforms before EU dispatch (~120-cycle microcode trap avoided)."

vulkan_game_engine_presets:
