    code: "ENG_UNREAL_5_VULKAN"
    engine_name: "Unreal Engine 5 (Nanite / Lumen / VSM)"
    vk_engine_match: ["UnrealEngine", "UE5"]
    simd_subgroup: 16
    slm_shared_bytes: 49152
    bottleneck_solved: "Indirect draw BDA churn, pipeline stutter, and Lumen GI UMA bus contention"
    krystal_techniques: ["GPL Zero-Heap CSO", "128B BDA Indirect Weld", "TH_09 UMA<0.78 AVX-512 Async Spill", "Stream-FPS Shadow 2x"]
