# Enterprise Kubernetes & Docker Compose Architecture pre Data Centra a GPU Farmy
# Tento manifest je punc pripravený pre priamy predpredaj Enterprise korporáciám

version: '3.8'

services:
  krystal_fleet_node:
    build:
      context: .
      dockerfile: Dockerfile.enterprise
    deploy:
      resources:
        reservations:
          # Priamy passthrough NVIDIA alebo AMD host GPU do podu pre zero-copy vulkan memory
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu, compute, video, utility ]
    environment:
      - KRYSTAL_MODE=enterprise
      - BIG_DATA_STREAM=kafka://kafka-broker:9092
      - CENTRAL_ADMIN_URL=https://noc-command.local:9090
      - SWARM_P2P_PORT=8333
      - RUST_LOG=info
    ports:
      - "8080:8080" # GlassBrain JSON API pre rýchlu NOC diagnostiku
      - "9090:9090" # Central Admin Interface pre Override Commandy
      - "8333:8333" # Gossip Protokol pre P2P Decentralizovaný Swarm
    volumes:
      - /sys/class/hwmon:/sys/class/hwmon:ro # Read-only Telemetry pre Shadow Council (Overclocking)
      - /dev/shm:/dev/shm # Využitie Shared-Memory pre rýchly prenos tensorov medzi AI jobmi

  # ---- BIG DATA INFRAŠTRUKTÚRA ----
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9091:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      # Tu by sme zbierali /metrics z "GlassBrainu" namapované na grafanu pre korporát.

  grafana:
    image: grafana/grafana-enterprise:latest # Enterprise dashboarding
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus

  # ---- ENTERPRISE KAFKA BROKER (DATA LAKE SHIPPERS) ----
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka-broker:
    image: confluentinc/cp-kafka:latest
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-broker:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
