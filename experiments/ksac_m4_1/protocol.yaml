# ==============================================================================
# KSAC M4.1 — PHYSICAL VALIDATION EXPERIMENTAL PROTOCOL
# ==============================================================================
# Normative Status: FROZEN EXPERIMENTAL BENCHMARK SPECIFICATION
# Constitutional Invariant: VITAL_MAX_HP == 6 (Delta S == 0 on breach)
# Two-Gate Structure: M4.1-A (Pre-registration) | M4.1-B (Physical FPGA)
# ==============================================================================

experiment:
  id: "KSAC-M4.1-VHL-PHYSICAL-VALIDATION"
  version: "2.0-FROZEN-TWO-GATE"
  date: "2026-10-27"
  gates:
    M4_1_A:
      name: "Experimental Protocol, Calibration & Evidence Framework"
      status: "COMPLETE / FROZEN"
      metric: "VHL_HC (Harness-Calibrated Verified Hardware Leverage)"
      result: 1.1516
      confidence_interval_95: [1.1408, 1.1624]
      verdict: "STRONG_PASS (Harness Pre-registration)"
    M4_1_B:
      name: "Physical FPGA Validation via PCIe/JTAG Live Telemetry"
      status: "PENDING LIVE ACQUISITION"
      metric: "VHL_F (FPGA-Measured Verified Hardware Leverage)"
      target_bitstream: "ksac_kcb_m4_top.bit (SHA256: 7f83b165...)"
      physical_hypothesis: "H1: VHL_F > 1.0 (STATUS: OPEN)"
      null_hypothesis: "H0: VHL_F <= 1.0 (STATUS: OPEN)"

definitions:
  vhl_hc:
    formula: "(W_A / E_A) / (W_B / E_B) [Harness Calibrated]"
    description: "Verified Hardware Leverage evaluated under calibrated physical prototype parameters"
  
  vhl_f:
    formula: "(W_A / E_A) / (W_B / E_B) [FPGA Measured]"
    description: "Verified Hardware Leverage measured from physical FPGA silicon and host hardware"
    promotion_rule: "VHL_HC transitions to VHL_F strictly upon live streaming acquisition"

  energy_integration:
    formula: "E_FPGA = \int_0^{T_window} P_FPGA(t) dt"
    description: "Total physical energy consumed by FPGA board over experimental window"
    bounds:
      active_control_energy: "E_control,active = P_active * t_duty (used for control leverage analysis)"
      gross_board_energy: "E_FPGA,gross = full board integral including idle, BRAM, transceivers, regulators"

  useful_work:
    criteria: "Total completed inference or task units strictly meeting SLA"
    validity_gate: "latency < P95_limit AND output_valid == True"
    degradation_rule: "Dropped quality or SLA breach disqualifies work unit from W"

  clf_normalized:
    formula: "(Delta_W / W_B) / (E_control / E_B)"
    description: "Normalized Control Leverage Factor (relative performance leverage per unit control energy)"

  calibration_error:
    formula: "CE = CE_pcie + CE_thermal + CE_scheduler + CE_measurement + CE_model + epsilon"
    status: "UNATTRIBUTED_HYPOTHESIS_PENDING_DISCRIMINATING_CDT_PROBES"
    absolute: "abs(VHL_S - VHL_HC) = 0.3336"
    relative: "abs(VHL_S - VHL_HC) / VHL_S = 22.46%"

baselines:
  - id: "B0"
    name: "OS Default Governor"
    description: "Standard Linux CFS scheduler and ondemand/powersave governor"
  - id: "B1"
    name: "Static Hand-Tuned Optimum"
    description: "Fixed statically tuned batch, worker count, and pinned clock (Key target: K > B1)"
  - id: "B2"
    name: "Dynamic State-of-the-Art Governor"
    description: "Best commercial runtime autoscaler / dynamic governor"
  - id: "K"
    name: "KCB-M4 FPGA Adaptive"
    description: "Krystal Control Coprocessor active via PCIe mailbox (208 ns core pipeline)"

workload:
  name: "Heterogeneous Compute Inference & GraphQL DAG"
  state_vector: "[C, M, T, E, Q, L]" # Compute, Memory, Thermal, Energy, Queue, Latency
  action_space:
    A0: "HOLD"
    A1: "BATCH_DOWN"
    A2: "BATCH_UP"
    A3: "WORKERS_DOWN"
    A4: "WORKERS_UP"
    A5: "PERFORMANCE_HINT_UP"
    A6: "PERFORMANCE_HINT_DOWN"
  voltage_writes_allowed: false

timing_separation:
  t_core_target_ns: 208.0    # FPGA internal microcode pipeline (Ingress -> DecisionLatch)
  t_system_target_us: 2.85   # Host-to-host end-to-end loop via PCIe mailbox

statistical_protocol:
  design: "Randomized Block Design (RBD)"
  blocks: 30
  trials_per_block: 2 # 1 B1 and 1 K per block
  total_runs: 60
  pair_definition: "Pair_i = (B1_i, K_i) within identical experimental block i"
  block_randomization: "Execution order within each block is randomized (B1->K or K->B1) to eliminate thermal drift"
  confidence_interval_pct: 95.0
  pass_criteria:
    formal_pass: "CI_95_lower(VHL) > 1.0"
    strong_pass: "CI_95_lower(VHL) > 1.10"
    safety_gate: "InvariantViolationRate == 0 AND InvalidCommitRate == 0"
