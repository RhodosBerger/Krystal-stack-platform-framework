name: GAMESA CI/CD

on:
  push:
    branches: [main, develop, claude/*]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  PYTHON_VERSION: "3.11"

jobs:
  # ============================================================
  # Lint & Format Check
  # ============================================================
  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python linters
        run: pip install ruff mypy

      - name: Lint Python
        run: |
          ruff check src/python/ --output-format=github
          ruff format --check src/python/

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Lint Rust
        run: |
          if [ -d "src/rust-bot" ]; then
            cd src/rust-bot
            cargo fmt --check || true
            cargo clippy || true
          elif [ -f "Cargo.toml" ]; then
            cargo fmt --check || true
            cargo clippy || true
          fi

  # ============================================================
  # Python Tests
  # ============================================================
  test-python:
    runs-on: ubuntu-22.04
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        experimental: [false]
        include:
          - python-version: "3.14"
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ matrix.python-version }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu || true
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        run: |
          python -m pytest tests/ -v --cov=src/python --cov-report=xml --ignore=tests/integration || python -m unittest discover tests

      - name: KrystalSDK smoke test
        run: |
          python -m src.python.krystal_sdk health --json
          python -m src.python.krystal_sdk bench --json

      - name: Procedural Land Throughput & Determinism Benchmark Gate
        run: |
          python scripts/benchmark_procedural_land.py --ci

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

  # ============================================================
  # Rust Tests
  # ============================================================
  test-rust:
    runs-on: ubuntu-22.04
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/rust-bot/target
            target
          key: cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-

      - name: Build
        run: |
          if [ -d "src/rust-bot" ]; then
            cd src/rust-bot && cargo build --release
          elif [ -f "Cargo.toml" ]; then
            cargo build --release
          fi

      - name: Test
        run: |
          if [ -d "src/rust-bot" ]; then
            cd src/rust-bot && cargo test --release
          elif [ -f "Cargo.toml" ]; then
            cargo test --release
          fi

  # ============================================================
  # C Core Build
  # ============================================================
  build-c:
    runs-on: ubuntu-22.04
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build libvulkan-dev

      - name: Build C core
        run: |
          if [ -d "src/c" ] && [ -f "src/c/CMakeLists.txt" ]; then
            mkdir -p src/c/build
            cd src/c/build
            cmake .. -GNinja -DCMAKE_BUILD_TYPE=Release
            ninja
          elif [ -f "CMakeLists.txt" ]; then
            mkdir -p build && cd build
            cmake .. -GNinja -DCMAKE_BUILD_TYPE=Release
            ninja
          fi

  # ============================================================
  # GPU Integration Tests (Self-hosted runner with GPU)
  # ============================================================
  test-gpu:
    runs-on: [self-hosted, gpu]
    needs: [test-python, test-rust]
    if: false # Disabled on GitHub cloud runners until self-hosted GPU runner is registered
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt

      - name: Verify GPU stack
        run: |
          source venv/bin/activate
          python scripts/verify_stack.py

      - name: Run GPU tests
        run: |
          source venv/bin/activate
          python -m pytest tests/integration/gpu -v

  # ============================================================
  # Package Build
  # ============================================================
  package:
    runs-on: ubuntu-22.04
    needs: [test-python, test-rust, build-c]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install build tools
        run: |
          pip install build wheel
          sudo apt-get install -y cmake ninja-build

      - name: Build Python wheel
        run: python -m build

      - name: Build Rust binary
        run: |
          if [ -d "src/rust-bot" ]; then
            cd src/rust-bot && cargo build --release
          elif [ -f "Cargo.toml" ]; then
            cargo build --release
          fi

      - name: Prepare artifacts
        run: |
          mkdir -p dist/bin
          cp target/release/gamesa-bot dist/bin/ 2>/dev/null || cp src/rust-bot/target/release/gamesa-bot dist/bin/ 2>/dev/null || true
          cp -r dist/*.whl dist/ 2>/dev/null || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gamesa-packages
          path: dist/

  # ============================================================
  # Docker Build
  # ============================================================
  docker:
    runs-on: ubuntu-22.04
    needs: package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # Documentation
  # ============================================================
  docs:
    runs-on: ubuntu-22.04
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Generate Rust docs
        run: |
          if [ -d "src/rust-bot" ]; then
            cd src/rust-bot && cargo doc --no-deps
          elif [ -f "Cargo.toml" ]; then
            cargo doc --no-deps
          fi
          mkdir -p doc-dist
          if [ -d "target/doc" ]; then
            cp -r target/doc/* doc-dist/
          elif [ -d "src/rust-bot/target/doc" ]; then
            cp -r src/rust-bot/target/doc/* doc-dist/
          fi

      - name: Upload docs
        uses: actions/upload-artifact@v4
        with:
          name: docs
          path: doc-dist/
